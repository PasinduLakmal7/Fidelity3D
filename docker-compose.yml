version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  lowpoly_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A lowpoly_worker.worker worker -Q free_queue -l info
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  premium_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A premium_worker.worker worker -Q premium_queue -l info
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  animation_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A animation_worker.worker worker -Q animation_queue -l info
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
